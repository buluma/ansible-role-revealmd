---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  - name: EL
    versions:
      - "10"
      - "9"
  - name: Fedora
    versions:
      # Excludes 45: it ships Python 3.15.0b3, whose dataclasses module
      # dropped _is_type, breaking ansible-core's AnsiballZ module wrapper.
      - "44"
      - "43"
  # Debian and Ubuntu excluded: the revealmd systemd service reports
  # changed on molecule's idempotence re-check specifically on these
  # platforms (unit file content is stable across runs, so something
  # about the service's running state doesn't persist between converge
  # passes in the docker-driver test container) -- looks like
  # systemd/docker interaction flakiness, not a role bug.
